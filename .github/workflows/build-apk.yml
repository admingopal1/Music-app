name: Build APK

on:
  push:
    branches: [ main, feature/vidmate-style-download-hub ]
  pull_request:
  workflow_dispatch:

# Keep only the newest build for a branch; rapid commits should not queue stale APK builds.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Run local unit tests
        run: gradle testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Build optimized release APK
        run: gradle assembleRelease --stacktrace

      - name: Build optimized Android App Bundle
        run: gradle bundleRelease --stacktrace

      - name: Report APK sizes
        run: |
          find app/build/outputs/apk -type f -name '*.apk' -printf '%p %s bytes\\n' | sort

      - name: Print APK signing certificate fingerprints
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          if [ -z "$APKSIGNER" ]; then
            echo "::error::apksigner not found in Android SDK build-tools"
            exit 1
          fi
          echo "=== Debug APK signing certificate (use these values in Firebase) ==="
          "$APKSIGNER" verify --print-certs "$APK"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload optimized release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-optimized
          path: app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Upload Android App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: app-release-bundle
          path: app/build/outputs/bundle/release/app-release.aab
