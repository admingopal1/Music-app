name: Build APK

on:
  push:
    branches: [ main, feature/vidmate-style-download-hub ]
  pull_request:
  workflow_dispatch:

# Keep only the newest build for a branch; rapid commits should not queue stale APK builds.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run local unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

  android-launch-smoke:
    runs-on: ubuntu-latest
    # Emulator boot is flaky on hosted runners; keep smoke coverage but never block APK delivery.
    continue-on-error: true
    # Cold emulator boot plus a first-time instrumentation compile can exceed 30 minutes.
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Launch app on Android emulator
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 900
          disable-animations: true
          script: chmod +x ./gradlew && ./gradlew connectedDebugAndroidTest --stacktrace --info
