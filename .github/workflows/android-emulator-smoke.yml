name: Android emulator smoke test

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# Keep the newest main-branch emulator run; APK delivery is handled by build-apk.yml.
concurrency:
  group: android-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-launch-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Launch app on Android emulator
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 900
          # Keep emulator defaults; readiness and diagnostics run in a checked-in Bash script.
          disable-animations: false
          # The runner executes script input as individual shell commands; invoke one Bash file.
          script: bash .github/scripts/run-emulator-smoke.sh

      - name: Upload emulator test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-emulator-diagnostics
          path: |
            app/build/reports/android-emulator/
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/
          if-no-files-found: ignore
