name: Android emulator smoke test

on:
  push:
    branches: [ main, upgrade/flagship-audio-lyrics-video ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# Keep the newest emulator run for each branch; APK delivery is handled by build-apk.yml.
concurrency:
  group: android-smoke-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  android-launch-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Install and launch app on Android 16 emulator
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 900
          # Avoid custom RAM/CPU overrides: hosted runners must retain headroom for the API 36 system image.
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          disable-animations: true
          script: |
            set -euo pipefail
            adb wait-for-device
            for attempt in $(seq 1 90); do
              boot_completed="$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)"
              if [ "$boot_completed" = "1" ]; then
                break
              fi
              sleep 2
            done
            test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1"

            adb shell settings put global window_animation_scale 0
            adb shell settings put global transition_animation_scale 0
            adb shell settings put global animator_duration_scale 0

            gradle testDebugUnitTest installDebug --stacktrace

            adb shell am force-stop com.app.musicplayer
            adb shell monkey -p com.app.musicplayer -c android.intent.category.LAUNCHER 1
            sleep 12

            if ! adb shell pidof com.app.musicplayer >/dev/null 2>&1; then
              adb logcat -d -v threadtime > app/build/reports/android-emulator-logcat.txt
              echo "Music Player process did not remain alive after launcher start."
              exit 1
            fi

            if ! adb shell dumpsys activity activities | grep -q 'com.app.musicplayer/.MainActivity'; then
              adb logcat -d -v threadtime > app/build/reports/android-emulator-logcat.txt
              adb shell dumpsys activity activities
              echo "MainActivity was not resumed after launch."
              exit 1
            fi

            mkdir -p app/build/reports/android-emulator
            adb logcat -d -v threadtime > app/build/reports/android-emulator/logcat.txt
            adb shell dumpsys activity activities > app/build/reports/android-emulator/activities.txt
            adb shell dumpsys package com.app.musicplayer > app/build/reports/android-emulator/package.txt

      - name: Upload emulator test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-emulator-diagnostics
          path: |
            app/build/reports/android-emulator/
            app/build/reports/android-emulator-logcat.txt
          if-no-files-found: ignore
