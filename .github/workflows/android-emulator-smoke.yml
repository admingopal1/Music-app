name: Android emulator smoke test

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# Keep the newest main-branch emulator run; APK delivery is handled by build-apk.yml.
concurrency:
  group: android-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-launch-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Launch app on Android emulator
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 900
          # Earlier failures happened during ADB animation-setting writes after boot.
          # Keep emulator defaults to avoid those extra ADB settings calls.
          disable-animations: false
          script: |
            set +e
            gradle connectedDebugAndroidTest --stacktrace --info
            test_exit=$?
            mkdir -p app/build/reports/android-emulator
            adb logcat -d -v threadtime > app/build/reports/android-emulator/logcat.txt || true
            adb shell dumpsys activity activities > app/build/reports/android-emulator/activities.txt || true
            adb shell dumpsys package com.app.musicplayer > app/build/reports/android-emulator/package.txt || true
            exit "$test_exit"

      - name: Upload emulator test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-emulator-diagnostics
          path: |
            app/build/reports/android-emulator/
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/
          if-no-files-found: ignore
