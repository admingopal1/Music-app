name: Android emulator smoke test

on:
  push:
    branches: [ main, upgrade/flagship-audio-lyrics-video ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# Keep the newest emulator run for each branch; APK delivery is handled by build-apk.yml.
concurrency:
  group: android-smoke-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  android-launch-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Launch app on Android 16 emulator
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-boot-timeout: 900
          # Give the API 36 system image enough RAM/CPU to avoid system_server stalls.
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -memory 4096 -cores 4
          disable-animations: false
          script: |
            bash -c 'set +e; gradle connectedDebugAndroidTest --stacktrace --info; test_exit=$?; mkdir -p app/build/reports/android-emulator; adb logcat -d -v threadtime > app/build/reports/android-emulator/logcat.txt || true; adb shell dumpsys activity activities > app/build/reports/android-emulator/activities.txt || true; adb shell dumpsys package com.app.musicplayer > app/build/reports/android-emulator/package.txt || true; exit "$test_exit"'

      - name: Upload emulator test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-emulator-diagnostics
          path: |
            app/build/reports/android-emulator/
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/
          if-no-files-found: ignore
