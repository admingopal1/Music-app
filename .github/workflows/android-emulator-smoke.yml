name: Android emulator smoke test

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# Keep the newest main-branch emulator run; APK delivery is handled by build-apk.yml.
concurrency:
  group: android-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-launch-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Launch app on Android emulator
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 900
          # Earlier failures happened during ADB animation-setting writes after boot.
          # Keep emulator defaults to avoid those extra ADB settings calls.
          disable-animations: false
          script: |
            # Wait for Android's package manager, not just the ADB transport, to be ready.
            # A previous run reached ADB but failed before installing the APK because
            # the emulator returned "Can't find service: package".
            set +e
            mkdir -p app/build/reports/android-emulator
            ready=0
            attempt=1
            while [ "$attempt" -le 90 ]; do
              boot_completed=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")
              if [ "$boot_completed" = "1" ] && adb shell cmd package list packages >/dev/null 2>&1; then
                ready=1
                echo "Android package manager is ready (attempt $attempt)."
                break
              fi
              echo "Waiting for Android package manager ($attempt/90)..."
              sleep 5
              attempt=$((attempt + 1))
            done

            if [ "$ready" -ne 1 ]; then
              echo "::error::Android package manager did not become ready within 7.5 minutes."
              adb shell getprop > app/build/reports/android-emulator/getprop.txt 2>&1 || true
              adb shell service list > app/build/reports/android-emulator/services.txt 2>&1 || true
              adb logcat -d -v threadtime > app/build/reports/android-emulator/logcat.txt 2>&1 || true
              exit 1
            fi

            gradle connectedDebugAndroidTest --stacktrace --info
            test_exit=$?
            adb logcat -d -v threadtime > app/build/reports/android-emulator/logcat.txt 2>&1 || true
            adb shell dumpsys activity activities > app/build/reports/android-emulator/activities.txt 2>&1 || true
            adb shell dumpsys package com.app.musicplayer > app/build/reports/android-emulator/package.txt 2>&1 || true
            exit "$test_exit"

      - name: Upload emulator test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-emulator-diagnostics
          path: |
            app/build/reports/android-emulator/
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/
          if-no-files-found: ignore
